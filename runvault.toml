# 指標が何を測っているか (runvault の宣言．rs-runvault docs/metrics.ja.md)．
#
# 名前は `simulation/src/record.rs` と `simulation/src/main.rs` が記録するものと一致していなければならない．
#
# `direction` は «値が大きいほど良いか»．模型の状態や到達量は成績ではないので
# `none` とし，再現精度やキャッシュ効率のように評価方向が定まる量だけ `up` /
# `down` とする．
#
# 推薦器ラベルを `_` で指標名へ連結するため，3 種類の有限な推薦器を展開して明示する．

[metrics."polarization_index"]
meaning   = "エージェントの意見値の分散で表した極化指数"
unit      = "variance"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."opinion_std"]
meaning   = "エージェントの意見値の標準偏差"
unit      = "score"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."active_user_count"]
meaning   = "そのステップで行動したユーザー数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."propagation_reach"]
meaning   = "投稿伝播が到達した一意なユーザー数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."cascade_size_max"]
meaning   = "最大情報カスケードに含まれる投稿数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."cascade_max_breadth"]
meaning   = "最大情報カスケードの最大幅"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."n_posts"]
meaning   = "その時点までに作成された投稿数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."herd_disagree_rate"]
meaning   = "反対扱いを受けたユーザーが群衆に追随した割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."converged"]
meaning   = "収束して終わったなら 1，打ち切りなら 0"
unit      = "boolean"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."final_step"]
meaning   = "シミュレーションが停止したステップ数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."llm_calls"]
meaning   = "この run が行った LLM の呼び出し回数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."llm_cache_hits"]
meaning   = "そのうちキャッシュで済んだ回数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."llm_cache_hit_rate"]
meaning   = "LLM 呼び出しのうちキャッシュで済んだ割合"
unit      = "ratio"
direction = "up"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."n_converged"]
meaning   = "この条件の試行のうち収束した本数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."mean_final_step"]
meaning   = "試行群にわたる停止ステップ数の平均"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."mean_final_polarization_index"]
meaning   = "試行群にわたる最終極化指数の平均"
